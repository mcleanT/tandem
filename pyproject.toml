[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tandem"
version = "0.1.0"
description = "MCP bridge that lets each Codex session drive its own dedicated Claude Code session in cmux"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastmcp==3.1.0",
    "mcp==1.26.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tandem-bridge = "cmux_bridge.server:main"

[tool.setuptools.packages.find]
where = ["bridge"]
include = ["cmux_bridge*"]

[tool.pytest.ini_options]
testpaths = ["bridge/tests"]
